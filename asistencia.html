<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirigiendo al registro de asistencia · ISIS2007</title>
    <meta http-equiv="refresh" content="3; url=asistencia-simple.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/theme.css">
    <style>
        .redirect {
            min-height: calc(100vh - var(--topbar-h));
            display: grid;
            place-items: center;
            padding: 40px 24px;
            background: var(--surface-2);
        }
        .redirect__box {
            max-width: 480px;
            width: 100%;
            text-align: center;
            padding: 40px 32px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .redirect__box h1 { font-size: 1.25rem; margin-bottom: 12px; }
        .redirect__box p { font-size: 14.5px; color: var(--muted); }
        .spinner {
            width: 34px; height: 34px;
            margin: 0 auto 22px;
            border: 3px solid var(--line);
            border-top-color: var(--uni-yellow);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body data-no-footer>
    <div class="page">
        <div class="redirect">
            <div class="redirect__box">
                <div class="spinner"></div>
                <h1>Redirigiendo al registro de asistencia</h1>
                <p>
                    El sistema de asistencia se consolidó en una única versión, más estable.
                    Te llevamos allí en un momento.
                </p>
                <a href="asistencia-simple.html" class="btn mt-16">Ir ahora al registro de asistencia</a>
            </div>
        </div>
    </div>

    <script src="assets/site.js"></script>
    <script>
        setTimeout(function () {
            window.location.replace('asistencia-simple.html');
        }, 3000);
    </script>
</body>
</html>
